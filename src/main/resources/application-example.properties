# ---------- Aplicacion ----------
spring.application.name=merchstock-app
server.port=8080
server.servlet.context-path=/

# ---------- Base de Datos MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/merchstock_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=CAMBIAR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---------- DevTools ----------
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ---------- Logging (Logback) ----------
logging.level.root=INFO
logging.level.com.merchstock=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/merchstock.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.level.org.apache.poi=WARN

# ---------- Validation ----------
spring.mvc.problemdetails.enabled=true
server.error.include-message=always
server.error.include-binding-errors=always

# ---------- Internacionalizacion ----------
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale=es_PE
spring.web.locale-resolver=fixed

# ---------- Multipart (subida de archivos) ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB