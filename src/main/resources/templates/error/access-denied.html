<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Denegado - MerchStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --navy: #1F3864;
            --teal: #2E8B7A;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .denied-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 50px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .icon-denied {
            font-size: 5rem;
            color: #dc3545;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--navy);
            font-weight: 700;
            margin-bottom: 15px;
        }
        .btn-volver {
            background-color: var(--navy);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn-volver:hover {
            background-color: var(--teal);
            color: white;
        }
        .codigo-error {
            display: inline-block;
            background: #fee;
            color: #dc3545;
            padding: 4px 12px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="denied-card">
    <i class="bi bi-shield-lock-fill icon-denied"></i>

    <span class="codigo-error">ERROR 403</span>

    <h1 class="mt-3">Acceso Denegado</h1>

    <p class="text-muted mb-4">
        Tu cuenta no tiene los permisos necesarios para acceder a este recurso.<br>
        Si crees que esto es un error, contacta al administrador del sistema.
    </p>

    <div class="d-flex justify-content-center gap-2">
        <a th:href="@{/}" class="btn btn-volver">
            <i class="bi bi-house-fill"></i> Volver al Inicio
        </a>
        <a th:href="@{/logout}" class="btn btn-outline-secondary">
            <i class="bi bi-box-arrow-right"></i> Cerrar Sesi&oacute;n
        </a>
    </div>

    <hr class="my-4">

    <small class="text-muted">
        &copy; 2026 MerchStock - APF3 - Grupo 3 - UTP 2026
    </small>
</div>

</body>
</html>
