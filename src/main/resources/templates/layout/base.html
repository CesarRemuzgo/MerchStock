<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} ?: 'MerchStock - Sistema de Inventario'">MerchStock</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --navy: #1F3864;
            --steel-blue: #4472C4;
            --teal: #2E8B7A;
        }
        body {
            background-color: #f5f7fa;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .navbar-brand {
            font-weight: 700;
            color: white !important;
        }
        .bg-navy {
            background-color: var(--navy) !important;
        }
        .btn-navy {
            background-color: var(--navy);
            color: white;
        }
        .btn-navy:hover {
            background-color: var(--steel-blue);
            color: white;
        }
        .badge-stock-bajo {
            background-color: #dc3545;
        }
        .badge-stock-ok {
            background-color: var(--teal);
        }
        .table thead {
            background-color: var(--navy);
            color: white;
        }
        .card-header-navy {
            background-color: var(--navy);
            color: white;
        }
    </style>
</head>
<body>

<!-- ============================================================
     HEADER / NAVBAR
============================================================ -->
<nav class="navbar navbar-expand-lg bg-navy navbar-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-box-seam"></i> MerchStock
        </a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/productos}">
                        <i class="bi bi-grid-3x3-gap"></i> Productos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/productos/alertas}">
                        <i class="bi bi-bell"></i> Alertas
                    </a>
                </li>
            </ul>
            <span class="text-white-50 small">
                <i class="bi bi-shield-check"></i> APF3 - Grupo 3 - UTP 2026
            </span>
        </div>
    </div>
</nav>

<!-- ============================================================
     CONTENIDO PRINCIPAL
============================================================ -->
<main class="container my-4">

    <!-- Mensajes flash -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- El contenido especifico de cada pagina ira aqui -->
    <div th:replace="${contenido}">
        <p>Contenido placeholder. Cada vista lo reemplaza.</p>
    </div>
</main>

<!-- ============================================================
     FOOTER
============================================================ -->
<footer class="bg-navy text-white text-center py-3 mt-5">
    <div class="container">
        <small>
            &copy; 2026 MerchStock Per&uacute; E.I.R.L. -
            Curso Integrador I - Secci&oacute;n 27667 -
            Grupo 3
        </small>
    </div>
</footer>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
