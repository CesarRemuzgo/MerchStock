<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categoria - MerchStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --navy: #1F3864; }
        body { background-color: #f5f7fa; font-family: 'Segoe UI', sans-serif; }
        .bg-navy { background-color: var(--navy) !important; }
        .navbar-brand { font-weight: 700; color: white !important; }
        .card-header-navy { background-color: var(--navy); color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-navy navbar-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="bi bi-box-seam"></i> MerchStock</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/productos}">Productos</a></li>
                <li class="nav-item"><a class="nav-link active text-white" th:href="@{/categorias}">Categorias</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/productos/alertas}">Alertas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">

    <div th:if="${mensajeError}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${mensajeError}"></span>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm">
                <div class="card-header card-header-navy">
                    <h4 class="mb-0">
                        <i class="bi bi-tags"></i>
                        <span th:text="${modo == 'nuevo'} ? 'Nueva Categoria' : 'Editar Categoria'">Categoria</span>
                    </h4>
                </div>
                <div class="card-body">

                    <form th:action="${modo == 'nuevo'} ? @{/categorias} : @{/categorias/{id}(id=${categoria.id})}"
                          th:object="${categoria}" method="post" novalidate>

                        <!-- Nombre -->
                        <div class="mb-3">
                            <label class="form-label">Nombre <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{nombre}"
                                   placeholder="Ej: Tazas, Polos, Gorras..."
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{nombre}">Error</div>
                        </div>

                        <!-- Descripcion -->
                        <div class="mb-3">
                            <label class="form-label">Descripci&oacute;n</label>
                            <textarea class="form-control" th:field="*{descripcion}" rows="3"
                                      placeholder="Descripcion opcional de la categoria..."
                                      th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:errors="*{descripcion}">Error</div>
                            <small class="text-muted">Maximo 200 caracteres</small>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/categorias}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i>
                                <span th:text="${modo == 'nuevo'} ? 'Guardar' : 'Actualizar'">Guardar</span>
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>

</div>

<footer class="bg-navy text-white text-center py-3 mt-5">
    <small>&copy; 2026 MerchStock - APF3 - Grupo 3 - UTP 2026</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
