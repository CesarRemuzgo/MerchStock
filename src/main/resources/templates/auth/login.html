<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesi&oacute;n - MerchStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --navy: #1F3864;
            --teal: #2E8B7A;
            --steel: #4472C4;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--navy) 0%, var(--steel) 50%, var(--teal) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 420px;
            width: 100%;
        }
        .login-header {
            background: var(--navy);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .login-header i {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }
        .login-header h1 {
            margin: 0;
            font-weight: 700;
            font-size: 1.8rem;
        }
        .login-header small {
            opacity: 0.85;
        }
        .login-body {
            padding: 30px;
        }
        .form-control:focus {
            border-color: var(--steel);
            box-shadow: 0 0 0 0.2rem rgba(68, 114, 196, 0.25);
        }
        .btn-login {
            background-color: var(--navy);
            color: white;
            border: none;
            padding: 12px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn-login:hover {
            background-color: var(--steel);
            color: white;
        }
        .info-credentials {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-top: 20px;
            font-size: 0.85rem;
        }
        .info-credentials code {
            color: var(--navy);
            font-weight: 600;
        }
        .footer-text {
            text-align: center;
            color: rgba(255,255,255,0.85);
            margin-top: 20px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div>
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-box-seam"></i>
            <h1>MerchStock</h1>
            <small>Sistema de Gesti&oacute;n de Inventario</small>
        </div>

        <div class="login-body">

            <div th:if="${mensajeError}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${mensajeError}">Error</span>
            </div>
            <div th:if="${mensajeExito}" class="alert alert-success" role="alert">
                <i class="bi bi-check-circle-fill"></i> <span th:text="${mensajeExito}">Exito</span>
            </div>
            <div th:if="${mensajeAlerta}" class="alert alert-warning" role="alert">
                <i class="bi bi-clock-fill"></i> <span th:text="${mensajeAlerta}">Alerta</span>
            </div>

            <h5 class="mb-3"><i class="bi bi-shield-lock"></i> Iniciar Sesi&oacute;n</h5>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control"
                               placeholder="usuario" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contrase&ntilde;a</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control"
                               placeholder="********" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-login w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Ingresar
                </button>

            </form>

        </div>
    </div>

    <p class="footer-text">
        &copy; 2026 MerchStock - APF3 - Grupo 3 - UTP 2026
    </p>
</div>

</body>
</html>
