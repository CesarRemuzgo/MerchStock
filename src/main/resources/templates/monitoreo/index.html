<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Monitoreo del Sistema — MerchStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta http-equiv="refresh" content="30">
</head>
<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Monitoreo del Sistema</h2>
        <span class="badge fs-6"
              th:classappend="${estadoGeneral == 'UP'} ? 'bg-success' :
                              (${estadoGeneral == 'ALERTA'} ? 'bg-warning text-dark' : 'bg-danger')"
              th:text="${estadoGeneral}">UP</span>
    </div>

    <p class="text-muted">La página se actualiza automáticamente cada 30 segundos.</p>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h6 class="text-muted">Tiempo activo</h6>
                    <h3 class="mb-0" th:text="${uptime}">0h 0m</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h6 class="text-muted">Memoria (heap)</h6>
                    <h3 class="mb-0">
                        <span th:text="${heapUsado}">0</span> /
                        <span th:text="${heapMaximo}">0</span> MB
                    </h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h6 class="text-muted">Uso de CPU</h6>
                    <h3 class="mb-0"><span th:text="${cpu}">0</span> %</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h6 class="text-muted">Peticiones HTTP</h6>
                    <h3 class="mb-0" th:text="${peticiones}">0</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h6 class="text-muted">Consumo de memoria heap</h6>
            <div class="progress" style="height: 26px;">
                <div class="progress-bar"
                     th:classappend="${porcentajeHeap} >= 85 ? 'bg-danger' :
                                     (${porcentajeHeap} >= 70 ? 'bg-warning' : 'bg-success')"
                     role="progressbar"
                     th:style="'width:' + ${porcentajeHeap} + '%'"
                     th:text="${porcentajeHeap} + '%'">0%
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h6 class="mb-3">Endpoints técnicos de Actuator</h6>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/actuator/health}" target="_blank">/actuator/health</a>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/actuator/metrics}" target="_blank">/actuator/metrics</a>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/actuator/info}" target="_blank">/actuator/info</a>
            <a class="btn btn-secondary btn-sm float-end" th:href="@{/}">Volver al inicio</a>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
